# Docker Compose configuration for ModelServe
# Services: API, MLflow, PostgreSQL, Redis, Prometheus, Grafana

# version: "3.8" (removed)

services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modelserve-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_NAME=modelserve-model
      - LOCAL_MODEL_PATH=/app/models/model.pkl
      - FEAST_FEATURE_SERVER_URL=http://feature-server:8888
      - MODEL_STAGE=Production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FEAST_CONFIG_PATH=/app/feast_repo/feature_store.yaml
    depends_on:
      - mlflow
      - redis
    networks:
      - modelserve
    volumes:
      - ./models:/app/models
      - feast_data:/home/appuser/.cache/feast
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MLflow Tracking Server
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: modelserve-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    environment:
      - MLFLOW_TRACKING_INSECURE_USE_HTTP=true
      - MLFLOW_TRACKING_USERNAME=admin
      - MLFLOW_TRACKING_PASSWORD=admin123
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:///mlflow.db", "--serve-artifacts", "--workers", "2", "--allowed-hosts", "*", "--cors-allowed-origins", "*"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - modelserve
    restart: unless-stopped

  # PostgreSQL for MLflow
  postgres:
    image: postgres:15-alpine
    container_name: modelserve-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
      - POSTGRES_DB=mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - modelserve
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Feature Store (online)
  redis:
    image: redis:7-alpine
    container_name: modelserve-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - modelserve
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: modelserve-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - modelserve
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:10.1.0
    container_name: modelserve-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    networks:
      - modelserve
    restart: unless-stopped

  # Feature Store Server (Redis as Feast online store)
  feast:
    image: redis:7-alpine
    container_name: modelserve-feast
    ports:
      - "6561:6379"
    volumes:
      - feast_data:/data
    command: redis-server --appendonly yes
    networks:
      - modelserve
    restart: unless-stopped

networks:
  modelserve:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  feast_data:
  mlflow_data:
