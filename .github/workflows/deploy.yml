name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest app/tests/ -v --tb=short

  build-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/modelserve-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/modelserve-api-prod:${{ steps.meta.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/modelserve-api-prod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push MLflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mlflow
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/modelserve-mlflow-prod:${{ steps.meta.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/modelserve-mlflow-prod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/modelserve-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=modelserve-prod" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP"      >> "$GITHUB_OUTPUT"

      - name: Upload deploy artifacts to S3
        env:
          S3_BUCKET: modelserve-mlflow-artifacts-prod-${{ env.AWS_ACCOUNT_ID }}
        run: |
          aws s3 cp docker-compose.yml     "s3://$S3_BUCKET/deploy/docker-compose.yml"
          aws s3 sync monitoring/          "s3://$S3_BUCKET/deploy/monitoring/"
          aws s3 cp fraud_model_v2.pkl     "s3://$S3_BUCKET/deploy/models/model.pkl"

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          ECR_REGISTRY: ${{ needs.build-push.outputs.ecr_registry }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          S3_BUCKET: modelserve-mlflow-artifacts-prod-${{ env.AWS_ACCOUNT_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              'set -e',
              'S3_BUCKET=$S3_BUCKET ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG=$IMAGE_TAG bash -s <<\"SCRIPT\"',
              'mkdir -p ~/modelserve/monitoring ~/modelserve/models',
              'aws s3 cp s3://\$S3_BUCKET/deploy/docker-compose.yml ~/modelserve/docker-compose.yml',
              'aws s3 sync s3://\$S3_BUCKET/deploy/monitoring/ ~/modelserve/monitoring/',
              'aws s3 cp s3://\$S3_BUCKET/deploy/models/model.pkl ~/modelserve/models/model.pkl',
              'aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin \$ECR_REGISTRY',
              'docker pull \$ECR_REGISTRY/modelserve-api-prod:\$IMAGE_TAG',
              'docker pull \$ECR_REGISTRY/modelserve-mlflow-prod:\$IMAGE_TAG',
              'cd ~/modelserve && API_IMAGE=\$ECR_REGISTRY/modelserve-api-prod:\$IMAGE_TAG MLFLOW_IMAGE=\$ECR_REGISTRY/modelserve-mlflow-prod:\$IMAGE_TAG docker compose up -d --remove-orphans',
              'docker compose -f ~/modelserve/docker-compose.yml ps',
              'SCRIPT'
            ]" \
            --region "${{ env.AWS_REGION }}" \
            --output text \
            --query "Command.CommandId")

          echo "SSM command ID: $COMMAND_ID"

          # Poll until command finishes (timeout 10 min)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
          echo "SSM command timed out" && exit 1

      - name: Health check
        env:
          EC2_IP: ${{ steps.ec2.outputs.public_ip }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "http://$EC2_IP:8000/health"; then
              echo "API healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s…"
            sleep 15
          done
          echo "Health check timed out" && exit 1

      - name: Summary
        if: always()
        env:
          EC2_IP: ${{ steps.ec2.outputs.public_ip }}
        run: |
          {
            echo "## Deployment — ${{ github.sha }}"
            echo "| Service     | URL |"
            echo "|-------------|-----|"
            echo "| API         | http://$EC2_IP:8000 |"
            echo "| MLflow      | http://$EC2_IP:5000 |"
            echo "| Prometheus  | http://$EC2_IP:9090 |"
            echo "| Grafana     | http://$EC2_IP:3000 |"
          } >> "$GITHUB_STEP_SUMMARY"
