name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      version:
        description: 'Image tag or "latest"'
        required: false
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get EC2 instance IP
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=modelserve-${{ github.event.inputs.environment }}" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          
          IP=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Deploy to EC2
        env:
          EC2_IP: ${{ steps.ec2.outputs.ip }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "Deploying modelserve:${VERSION} to $EC2_IP"
          
          # Get ECR login token
          aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # Pull and restart container
          ssh -o StrictHostKeyChecking=no ec2-user@$EC2_IP << 'EOF'
            set -e
            VERSION=${VERSION:-latest}
            REGION=$(curl -s http://169.254.169.254/latest/meta-data/region)
            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
            
            # Pull new image
            docker pull $ECR_REGISTRY/modelserve:$VERSION || echo "Image not found, using local"
            
            # Blue-green deployment
            docker stop modelserve-old 2>/dev/null || true
            docker rm modelserve-old 2>/dev/null || true
            docker stop modelserve 2>/dev/null || true
            docker rm modelserve 2>/dev/null || true
            
            docker run -d \
              --name modelserve \
              -p 8000:8000 \
              --restart unless-stopped \
              -e MLFLOW_TRACKING_URI=http://mlflow:5000 \
              $ECR_REGISTRY/modelserve:$VERSION
            
            # Health check
            sleep 10
            curl -f http://localhost:8000/health || exit 1
            
            echo "Deployment successful"
          EOF

      - name: Verify deployment
        run: |
          curl -f https://api.modelserve.${{ github.event.inputs.environment }}.example.com/health || \
          curl -f http://${{ steps.ec2.outputs.ip }}:8000/health

  rollback:
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Rollback deployment
        run: |
          echo "Deployment failed! Initiating rollback..."
          # The previous container is still available if blue-green was used
          # In production, trigger PagerDuty, notify Slack
