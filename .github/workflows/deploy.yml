name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  build-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/modelserve-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/modelserve-api-prod:${{ steps.meta.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/modelserve-api-prod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push MLflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mlflow
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/modelserve-mlflow-prod:${{ steps.meta.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/modelserve-mlflow-prod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/modelserve-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=modelserve-prod" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP"      >> "$GITHUB_OUTPUT"

      - name: Send ephemeral SSH key via EC2 Instance Connect
        run: |
          ssh-keygen -t ed25519 -f /tmp/ec2_key -N "" -q
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --availability-zone "${{ env.AWS_REGION }}a" \
            --instance-os-user ec2-user \
            --ssh-public-key file:///tmp/ec2_key.pub
          chmod 600 /tmp/ec2_key

      - name: Copy app files to EC2
        env:
          EC2_IP: ${{ steps.ec2.outputs.public_ip }}
        run: |
          # Create remote directory structure
          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key ec2-user@"$EC2_IP" \
            "mkdir -p ~/modelserve/monitoring/prometheus ~/modelserve/monitoring/grafana"

          # Copy compose file and monitoring config
          scp -o StrictHostKeyChecking=no -i /tmp/ec2_key \
            docker-compose.yml \
            ec2-user@"$EC2_IP":~/modelserve/docker-compose.yml

          scp -o StrictHostKeyChecking=no -i /tmp/ec2_key -r \
            monitoring/ \
            ec2-user@"$EC2_IP":~/modelserve/

      - name: Deploy
        env:
          ECR_REGISTRY: ${{ needs.build-push.outputs.ecr_registry }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          EC2_IP: ${{ steps.ec2.outputs.public_ip }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -i /tmp/ec2_key \
              ec2-user@"$EC2_IP" \
            ECR_REGISTRY="$ECR_REGISTRY" IMAGE_TAG="$IMAGE_TAG" 'bash -s' << 'REMOTE'
            set -e

            # ECR login (instance role handles auth)
            aws ecr get-login-password --region ap-southeast-1 \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            cd ~/modelserve

            # Pull new images
            docker pull "$ECR_REGISTRY/modelserve-api-prod:$IMAGE_TAG"
            docker pull "$ECR_REGISTRY/modelserve-mlflow-prod:$IMAGE_TAG"

            export API_IMAGE="$ECR_REGISTRY/modelserve-api-prod:$IMAGE_TAG"
            export MLFLOW_IMAGE="$ECR_REGISTRY/modelserve-mlflow-prod:$IMAGE_TAG"

            docker compose up -d --remove-orphans
            docker compose ps
          REMOTE

      - name: Health check
        env:
          EC2_IP: ${{ steps.ec2.outputs.public_ip }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "http://$EC2_IP:8000/health"; then
              echo "API healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s…"
            sleep 15
          done
          echo "Health check timed out" && exit 1

      - name: Summary
        if: always()
        env:
          EC2_IP: ${{ steps.ec2.outputs.public_ip }}
        run: |
          {
            echo "## Deployment — ${{ github.sha }}"
            echo "| Service     | URL |"
            echo "|-------------|-----|"
            echo "| API         | http://$EC2_IP:8000 |"
            echo "| MLflow      | http://$EC2_IP:5000 |"
            echo "| Prometheus  | http://$EC2_IP:9090 |"
            echo "| Grafana     | http://$EC2_IP:3000 |"
          } >> "$GITHUB_STEP_SUMMARY"
