name: Infrastructure & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  PULUMI_STACK: production

jobs:
  # ============================================
  # Pulumi Infrastructure Provisioning
  # ============================================
  infrastructure:
    name: Provision Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load environment variables
        run: |
          if [ -f .env ]; then
            while IFS='=' read -r key value; do
              value=$(echo "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              if [[ ! "$key" =~ ^# && -n "$key" ]]; then
                echo "$key=$value" >> $GITHUB_ENV
              fi
            done < .env
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Pulumi
        uses: pulumi/actions@v4
        with:
          workdir: infrastructure/python

      - name: Login to Pulumi
        run: |
          echo "PULUMI_ACCESS_TOKEN=${{ secrets.PULUMI_ACCESS_TOKEN }}" >> $GITHUB_ENV
          cd infrastructure/python
          pulumi login

      - name: Preview infrastructure changes
        id: preview
        run: |
          cd infrastructure/python
          pulumi preview --stack ${{ env.PULUMI_STACK }} --non-interactive 2>&1 || true

      - name: Apply infrastructure changes
        id: apply
        run: |
          cd infrastructure/python
          pulumi up --stack ${{ env.PULUMI_STACK }} --yes --non-interactive
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Save outputs
        run: |
          cd infrastructure/python
          echo "EC2_IP=$(pulumi stack output elastic_ip)" >> $GITHUB_ENV
          echo "ECR_API_REPO=$(pulumi stack output ecr_api_repo)" >> $GITHUB_ENV
          echo "ECR_MLFLOW_REPO=$(pulumi stack output ecr_mlflow_repo)" >> $GITHUB_ENV
          echo "INSTANCE_ID=$(pulumi stack output instance_id)" >> $GITHUB_ENV

      - name: Upload SSH key to EC2
        run: |
          echo "${{ env.EC2_SSH_KEY }}" > ssh_key.pem
          chmod 600 ssh_key.pem
          mkdir -p ~/.ssh
          scp -o StrictHostKeyChecking=no -i ssh_key.pem ssh_key.pem ec2-user@${{ env.EC2_IP }}:~/.ssh/modelserve-key.pem
          rm ssh_key.pem

      - name: Setup Docker on EC2
        run: |
          echo "${{ env.EC2_SSH_KEY }}" > ssh_key.pem
          chmod 600 ssh_key.pem
          ssh -o StrictHostKeyChecking=no -i ssh_key.pem ec2-user@${{ env.EC2_IP }} << 'REMOTE'
            set -e
            chmod 600 ~/.ssh/modelserve-key.pem
            mkdir -p ~/modelserve ~/.aws
            cat > ~/.aws/credentials << 'AWSCREDS'
[default]
aws_access_key_id=${{ env.AWS_ACCESS_KEY_ID }}
aws_secret_access_key=${{ env.AWS_SECRET_ACCESS_KEY }}
region=${{ env.AWS_REGION }}
AWSCREDS
          REMOTE
          rm ssh_key.pem

  # ============================================
  # Build and Push Docker Images
  # ============================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load environment variables
        run: |
          if [ -f .env ]; then
            while IFS='=' read -r key value; do
              value=$(echo "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              if [[ ! "$key" =~ ^# && -n "$key" ]]; then
                echo "$key=$value" >> $GITHUB_ENV
              fi
            done < .env
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        run: |
          docker build -t modelserve:latest .
          docker tag modelserve:latest ${{ env.ECR_API_REPO }}:latest

      - name: Build MLflow Image
        run: |
          docker build -f Dockerfile.mlflow -t modelserve-mlflow:latest .
          docker tag modelserve-mlflow:latest ${{ env.ECR_MLFLOW_REPO }}:latest

      - name: Push API Image
        run: |
          docker push ${{ env.ECR_API_REPO }}:latest

      - name: Push MLflow Image
        run: |
          docker push ${{ env.ECR_MLFLOW_REPO }}:latest

  # ============================================
  # Deploy to EC2
  # ============================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [infrastructure, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load environment variables
        run: |
          if [ -f .env ]; then
            while IFS='=' read -r key value; do
              value=$(echo "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              if [[ ! "$key" =~ ^# && -n "$key" ]]; then
                echo "$key=$value" >> $GITHUB_ENV
              fi
            done < .env
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 Public IP
        run: |
          echo "EC2_IP=$(pulumi stack output elastic_ip --cwd infrastructure/python)" >> $GITHUB_ENV

      - name: Save SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.EC2_SSH_KEY }}" > ~/.ssh/modelserve-key.pem
          chmod 600 ~/.ssh/modelserve-key.pem

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/modelserve-key.pem ec2-user@${{ env.EC2_IP }} << 'REMOTE'
            set -e
            cd ~/modelserve

            # Update docker-compose.yml with ECR URLs
            cat > docker-compose.yml << 'DOCKERCOMPOSE'
$(cat docker-compose.yml | sed 's|783879612848.dkr.ecr.ap-southeast-1.amazonaws.com/modelserve:latest|${{ env.ECR_API_REPO }}:latest|g' | sed 's|783879612848.dkr.ecr.ap-southeast-1.amazonaws.com/modelserve-mlflow:latest|${{ env.ECR_MLFLOW_REPO }}:latest|g')

            docker-compose pull
            docker-compose up -d
            docker-compose ps
          REMOTE

      - name: Health check
        run: |
          sleep 30
          echo "Checking API health..."
          curl -f http://${{ env.EC2_IP }}:8000/health || echo "API not ready"

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| API | http://${{ env.EC2_IP }}:8000 |" >> $GITHUB_STEP_SUMMARY
          echo "| API Docs | http://${{ env.EC2_IP }}:8000/docs |" >> $GITHUB_STEP_SUMMARY
          echo "| MLflow | http://${{ env.EC2_IP }}:5000 |" >> $GITHUB_STEP_SUMMARY
          echo "| Prometheus | http://${{ env.EC2_IP }}:9090 |" >> $GITHUB_STEP_SUMMARY
          echo "| Grafana | http://${{ env.EC2_IP }}:3000 |" >> $GITHUB_STEP_SUMMARY