name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 679835924810.dkr.ecr.ap-southeast-1.amazonaws.com
  ECR_REPOSITORY: modelserve-951f5e5
  MLFLOW_REPOSITORY: modelserve-mlflow-d1fddd3
  EC2_INSTANCE_ID: i-039524dcb8de929c3
  EC2_IP: 52.76.194.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Save SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/modelserve-key-clean.pem
          chmod 600 ~/.ssh/modelserve-key-clean.pem

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/modelserve-key-clean.pem ec2-user@${{ env.EC2_IP }} 'mkdir -p ~/.ssh'
          scp -o StrictHostKeyChecking=no -i ~/.ssh/modelserve-key-clean.pem ~/.ssh/modelserve-key-clean.pem ec2-user@${{ env.EC2_IP }}:~/.ssh/
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/modelserve-key-clean.pem ec2-user@${{ env.EC2_IP }} << 'REMOTE'
            set -e
            chmod 600 ~/.ssh/modelserve-key-clean.pem
            cd ~/modelserve
            aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            docker build -f Dockerfile.mlflow -t modelserve-mlflow:latest .
            docker build -t modelserve:latest .
            docker tag modelserve-mlflow:latest ${{ env.ECR_REGISTRY }}/${{ env.MLFLOW_REPOSITORY }}:latest
            docker tag modelserve:latest ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            docker push ${{ env.ECR_REGISTRY }}/${{ env.MLFLOW_REPOSITORY }}:latest
            docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            docker-compose pull
            docker-compose up -d
            docker-compose ps
            echo "Deployment complete!"
          REMOTE

      - name: Health check
        run: |
          sleep 60
          echo "Checking API health..."
          curl -f http://${{ env.EC2_IP }}:8000/health || echo "API not ready"

      - name: Cleanup
        run: rm -f ~/.ssh/modelserve-key-clean.pem

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| API | http://${{ env.EC2_IP }}:8000 |" >> $GITHUB_STEP_SUMMARY
          echo "| MLflow | http://${{ env.EC2_IP }}:5000 |" >> $GITHUB_STEP_SUMMARY