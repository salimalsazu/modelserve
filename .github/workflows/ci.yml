name: CI/CD with Repository Variables

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECR_API_REPO: 679835924810.dkr.ecr.ap-southeast-1.amazonaws.com/modelserve-951f5e5
  ECR_MLFLOW_REPO: 679835924810.dkr.ecr.ap-southeast-1.amazonaws.com/modelserve-mlflow-d1fddd3
  EC2_IP: 52.76.194.2
  EC2_INSTANCE_ID: i-039524dcb8de929c3

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        run: |
          docker build -t modelserve-api:latest .
          docker tag modelserve-api:latest ${{ env.ECR_API_REPO }}:latest

      - name: Build MLflow Image
        run: |
          docker build -f Dockerfile.mlflow -t modelserve-mlflow:latest .
          docker tag modelserve-mlflow:latest ${{ env.ECR_MLFLOW_REPO }}:latest

      - name: Push Images
        run: |
          docker push ${{ env.ECR_API_REPO }}:latest
          docker push ${{ env.ECR_MLFLOW_REPO }}:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate SSH key for EC2
        run: |
          ssh-keygen -t rsa -b 2048 -f ~/.ssh/ec2_key -N "" -C "github-actions"

      - name: Authorize SSH key on EC2
        run: |
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id ${{ env.EC2_INSTANCE_ID }} \
            --availability-zone ap-southeast-1a \
            --ssh-public-key file://~/.ssh/ec2_key.pub \
            --region ap-southeast-1

      - name: Deploy files to EC2
        run: |
          ssh-keyscan -H ${{ env.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Setup Docker & deploy
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/ec2_key ec2-user@${{ env.EC2_IP }} << 'REMOTE'
            set -e
            chmod 600 ~/.ssh/ec2_key || true

            # Setup Docker
            sudo yum update -y
            sudo yum install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker ec2-user

            mkdir -p ~/modelserve ~/.aws
            cat > ~/.aws/credentials << 'AWSCREDS'
[default]
role_arn=arn:aws:iam::679835924810:role/ec2-ecr-access
credential_source=Ec2InstanceMetadataService
region=ap-southeast-1
AWSCREDS

            # Login to ECR
            aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 679835924810.dkr.ecr.ap-southeast-1.amazonaws.com

            # Pull and start services
            cd ~/modelserve
            docker-compose pull
            docker-compose up -d

            sleep 30
            docker-compose ps
          REMOTE

      - name: Health check
        run: |
          sleep 30
          echo "Checking API at http://${{ env.EC2_IP }}:8000/health"
          curl -f --max-time 30 http://${{ env.EC2_IP }}:8000/health || echo "API not ready yet"

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| API | http://${{ env.EC2_IP }}:8000 |" >> $GITHUB_STEP_SUMMARY
          echo "| API Docs | http://${{ env.EC2_IP }}:8000/docs |" >> $GITHUB_STEP_SUMMARY
          echo "| MLflow | http://${{ env.EC2_IP }}:5000 |" >> $GITHUB_STEP_SUMMARY